name: neg-artifact-poisoning-split
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@0123456789abcdef0123456789abcdef01234567
        with:
          name: out
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: ls out
  announce:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: ./announce.sh
        env:
          HOOK: ${{ secrets.ANNOUNCE_HOOK }}
