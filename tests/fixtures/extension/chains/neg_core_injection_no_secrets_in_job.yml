name: neg-injection-no-secrets-in-job
on:
  issues:
    types: [opened]
permissions:
  contents: read
jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: echo "New issue ${{ github.event.issue.title }}"
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: ./sync.sh
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
