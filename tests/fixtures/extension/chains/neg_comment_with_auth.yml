name: neg-comment-with-auth
on:
  issue_comment:
    types: [created]
permissions:
  contents: write
jobs:
  run-command:
    if: github.event.comment.author_association == 'OWNER' || github.event.comment.author_association == 'MEMBER'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: ./bot.sh "$BODY"
        env:
          BODY: ${{ github.event.comment.body }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
