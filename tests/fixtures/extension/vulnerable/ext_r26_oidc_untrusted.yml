name: ext-oidc-untrusted
on:
  pull_request:
permissions:
  id-token: write
  contents: read
jobs:
  aws-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::123456789012:role/ci-readonly
          aws-region: us-east-1
