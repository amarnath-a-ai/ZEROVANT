name: ext-comment-no-auth
on:
  issue_comment:
    types: [created]
permissions:
  contents: write
  issues: write
jobs:
  handle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@0123456789abcdef0123456789abcdef01234567
        with:
          persist-credentials: false
      - run: ./handle-command.sh "$BODY"
        env:
          BODY: ${{ github.event.comment.body }}
