name: ext-workflow-run-artifact-safe
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
permissions:
  contents: read
jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: echo "CI finished with $RESULT"
        env:
          RESULT: ${{ github.event.workflow_run.conclusion }}
