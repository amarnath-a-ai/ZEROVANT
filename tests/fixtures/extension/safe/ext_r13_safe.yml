name: ext-overprovisioned-secrets-safe
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@0123456789abcdef0123456789abcdef01234567
        with:
          persist-credentials: false
      - run: ./collect.sh
        env:
          API_TOKEN: ${{ secrets.REPORT_TOKEN }}
