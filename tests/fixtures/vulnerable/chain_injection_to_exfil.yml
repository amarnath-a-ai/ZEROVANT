name: Attack Chain Injection To Exfiltration
on:
  issues:
    types: [opened]

jobs:
  triage:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: write
    steps:
      - name: Process Issue
        env:
          REPO_SECRET: ${{ secrets.SUPER_SECRET_KEY }}
        run: |
          echo "Title: ${{ github.event.issue.title }}"
          echo "Secret check: $REPO_SECRET"

