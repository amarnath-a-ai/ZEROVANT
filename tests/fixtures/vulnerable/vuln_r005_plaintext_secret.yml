name: Vulnerable Plaintext Secret
on: [push]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Notification with Static Token
        env:
          SERVICE_WEBHOOK: https://hooks.example.com/services/T00000000/B00000000/mock_secret_webhook_string
          STATIC_API_TOKEN: super_secret_production_api_token_value_99999
        run: |
          curl -H "X-API-Key: $STATIC_API_TOKEN" https://api.example.com/user
