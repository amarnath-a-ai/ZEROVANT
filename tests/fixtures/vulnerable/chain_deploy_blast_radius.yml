name: Attack Chain Deploy Blast Radius
on:
  push:
    branches: [main]

jobs:
  production_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
      - name: Deploy Without Environment Protection
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.PROD_AWS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.PROD_AWS_SECRET }}
        run: |
          aws s3 sync ./build s3://production-company-bucket/

